openapi: 3.0.3
info:
  title: SkyPermit API
  version: "1.0.0"
  description: |
    Drone operator/pilot/aircraft registration and airspace flight-request
    authorisation. A flight request moves through a fixed state machine
    (`DRAFT` → `SUBMITTED` (transient) → `UNDER_REVIEW` / `REJECTED` →
    `APPROVED` / `REJECTED` → `CANCELLED` / `COMPLETED`), gated by four
    automated checks evaluated in order — `PILOT`, `AIRCRAFT`, `ZONE`,
    `TIME_WINDOW` — then a human reviewer approves or rejects it.

    See `docs/02-state-machine.md` for the full transition table and
    `docs/06-business-rules.md` for the real gate thresholds and
    `rule_reference` citations.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Operator login/logout/session, and registration
  - name: Operators
  - name: Pilots
  - name: Aircraft
  - name: Zones
    description: Read-only zone catalogue — no create/update endpoints
  - name: Flight requests

components:
  parameters:
    OperatorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PilotId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AircraftId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FlightRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    OperatorSession:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Set by `POST /operators` (register) or `POST /auth/login`. Scopes
        pilots/aircraft/flight-request writes and reads to the logged-in
        operator's own resources.
    ReviewerHeader:
      type: apiKey
      in: header
      name: X-Reviewer-Id
      description: >-
        A static string identity, not a real auth token. Required on the two
        reviewer decision endpoints; accepted as an alternative to an
        operator session on reads that a reviewer needs across every
        operator (single flight-request/pilot/aircraft/operator GETs, and
        `validate`).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    GateFailure:
      type: object
      description: The body of every `422` response.
      properties:
        failing_gate:
          $ref: '#/components/schemas/FailingGate'
        rule_reference:
          type: string
          description: >-
            Document + section responsible for the rule, e.g. `OH-1 §2.1` or
            `ZC-2026.1 §2`. See docs/06-business-rules.md §6.
          example: 'ZC-2026.1 §2'
        message:
          type: string
          description: Human-readable, specific to the failure. Written for an operator.
      required: [failing_gate, rule_reference, message]

    OperatorAuthorisationLevel:
      type: string
      enum: [L1, L2, L3]
    OperatorStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    PilotRating:
      type: string
      enum: [R_BASIC, R_ADVANCED, R_BVLOS]
    PilotStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    AircraftStatus:
      type: string
      enum: [ACTIVE, RETIRED]
    ZoneClass:
      type: string
      enum: [OPEN, CONTROLLED, RESTRICTED]
    WeightBand:
      type: string
      enum: [C0, C1, C2, C3]
    PilotCurrencyStatus:
      type: string
      enum: [CURRENT, LAPSED]
    FailingGate:
      type: string
      enum: [PILOT, AIRCRAFT, ZONE, TIME_WINDOW]
    FlightRequestState:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, CANCELLED, COMPLETED]

    Operator:
      type: object
      properties:
        id: { type: string, format: uuid }
        legal_name: { type: string }
        national_id: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        address_line: { type: string, nullable: true }
        city: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        authorisation_level:
          $ref: '#/components/schemas/OperatorAuthorisationLevel'
        registered_on: { type: string, format: date }
        status:
          $ref: '#/components/schemas/OperatorStatus'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterOperatorInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        legal_name: { type: string }
        national_id: { type: string }
        phone: { type: string }
        address_line: { type: string }
        city: { type: string }
        postal_code: { type: string }
      required: [email, password, legal_name, national_id]

    Pilot:
      type: object
      properties:
        id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid }
        full_name: { type: string }
        national_id: { type: string }
        rating:
          $ref: '#/components/schemas/PilotRating'
        certified_on: { type: string, format: date }
        status:
          $ref: '#/components/schemas/PilotStatus'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PilotWithCurrency:
      description: A Pilot row plus a read-time-derived currency status.
      allOf:
        - $ref: '#/components/schemas/Pilot'
        - type: object
          properties:
            currency_status:
              $ref: '#/components/schemas/PilotCurrencyStatus'

    PilotDetail:
      description: >-
        Returned by GET /pilots/{id} only — adds the date the pilot's
        18-month currency window expires, on top of what the list endpoint
        returns.
      allOf:
        - $ref: '#/components/schemas/PilotWithCurrency'
        - type: object
          properties:
            currency_expires_on: { type: string, format: date }

    CreatePilotInput:
      type: object
      properties:
        full_name: { type: string }
        national_id: { type: string }
        rating:
          $ref: '#/components/schemas/PilotRating'
        certified_on: { type: string, format: date }
      required: [full_name, national_id, rating, certified_on]

    Aircraft:
      type: object
      properties:
        id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid }
        manufacturer: { type: string }
        model: { type: string }
        serial_number: { type: string }
        mtom_grams:
          type: integer
          description: Maximum take-off mass in grams. Registration is rejected above 30,000g.
        registered_on: { type: string, format: date }
        status:
          $ref: '#/components/schemas/AircraftStatus'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AircraftWithBand:
      description: An Aircraft row plus a read-time-derived weight band.
      allOf:
        - $ref: '#/components/schemas/Aircraft'
        - type: object
          properties:
            weight_band:
              $ref: '#/components/schemas/WeightBand'

    CreateAircraftInput:
      type: object
      properties:
        manufacturer: { type: string }
        model: { type: string }
        serial_number: { type: string }
        mtom_grams: { type: integer, minimum: 1, maximum: 30000 }
      required: [manufacturer, model, serial_number, mtom_grams]

    Zone:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        zone_class:
          $ref: '#/components/schemas/ZoneClass'
        ceiling_metres: { type: integer }
        permitted_bands:
          type: array
          items:
            $ref: '#/components/schemas/WeightBand'
        required_authorisation_level:
          $ref: '#/components/schemas/OperatorAuthorisationLevel'
        curfew_start: { type: string, nullable: true, example: '22:00' }
        curfew_end: { type: string, nullable: true, example: '06:00' }
        active: { type: boolean }

    FlightRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid }
        pilot_id: { type: string, format: uuid }
        aircraft_id: { type: string, format: uuid }
        zone_code: { type: string }
        window_start: { type: string, format: date-time, description: UTC }
        window_end: { type: string, format: date-time, description: UTC }
        requested_altitude_metres: { type: integer }
        flight_purpose: { type: string, nullable: true, maxLength: 2000 }
        state:
          $ref: '#/components/schemas/FlightRequestState'
        rejection_reason: { type: string, nullable: true }
        failing_gate:
          allOf:
            - $ref: '#/components/schemas/FailingGate'
          nullable: true
        rule_reference: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by:
          type: string
          nullable: true
          description: Reviewer ID for a reviewer decision; null for a gate auto-rejection.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateFlightRequestInput:
      type: object
      properties:
        pilot_id: { type: string, format: uuid }
        aircraft_id: { type: string, format: uuid }
        zone_code: { type: string }
        window_start: { type: string, format: date-time, description: UTC }
        window_end: { type: string, format: date-time, description: UTC }
        requested_altitude_metres: { type: integer, minimum: 1 }
        flight_purpose: { type: string, maxLength: 2000 }
      required: [pilot_id, aircraft_id, zone_code, window_start, window_end, requested_altitude_metres]

    RejectInput:
      type: object
      properties:
        note: { type: string }
      required: [note]

    ApproveInput:
      type: object
      properties:
        note: { type: string }

    ValidateOk:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
      required: [ok]

  responses:
    BadRequest:
      description: Malformed request body or query param
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No operator session and no X-Reviewer-Id header
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but not permitted for this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Invalid state transition, or a scheduling conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GateFailed:
      description: Business rule violation — the first failing gate, in PILOT → AIRCRAFT → ZONE → TIME_WINDOW order
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GateFailure' }

paths:
  /operators:
    post:
      tags: [Auth]
      summary: Register an operator
      description: >-
        Creates the auth user and the Operator profile in one request, then
        signs the caller in (session cookie). Always registers at
        authorisation level L1 — raising it is an out-of-band admin action,
        not a form field.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterOperatorInput' }
      responses:
        '201':
          description: Operator created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /operators/{id}:
    get:
      tags: [Operators]
      summary: Retrieve an operator
      description: Self, or any reviewer.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      responses:
        '200':
          description: Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Sets the operator session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Clears the operator session.
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }

  /auth/me:
    get:
      tags: [Auth]
      summary: The logged-in operator's profile
      security:
        - OperatorSession: []
      responses:
        '200':
          description: Operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pilots:
    get:
      tags: [Pilots]
      summary: List the logged-in operator's pilots
      description: >-
        Not one of the original 16 — added because the frontend needs both a
        registry list and an operator-scoped picker. Always scoped to the
        session; there is no operator_id query param.
      security:
        - OperatorSession: []
      responses:
        '200':
          description: Pilots, each with a derived currency_status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PilotWithCurrency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Pilots]
      summary: Register a pilot
      description: Registers a pilot under the logged-in operator.
      security:
        - OperatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePilotInput' }
      responses:
        '201':
          description: Pilot created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pilot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pilots/{id}:
    get:
      tags: [Pilots]
      summary: Retrieve a pilot
      description: Owning operator, or any reviewer.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/PilotId'
      responses:
        '200':
          description: Pilot, with derived currency status and expiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PilotDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /aircraft:
    get:
      tags: [Aircraft]
      summary: List the logged-in operator's aircraft
      description: Same extension rationale as GET /pilots.
      security:
        - OperatorSession: []
      responses:
        '200':
          description: Aircraft, each with a derived weight_band
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AircraftWithBand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Aircraft]
      summary: Register an aircraft
      description: >-
        Registers an aircraft under the logged-in operator. Rejected above
        30,000g MTOM under any circumstance (OH-1 §3) — enforced before the
        aircraft row exists, ahead of any gate.
      security:
        - OperatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAircraftInput' }
      responses:
        '201':
          description: Aircraft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aircraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /aircraft/{id}:
    get:
      tags: [Aircraft]
      summary: Retrieve an aircraft
      description: Owning operator, or any reviewer.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/AircraftId'
      responses:
        '200':
          description: Aircraft, with derived weight_band
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AircraftWithBand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones:
    get:
      tags: [Zones]
      summary: List the zone catalogue
      security: []
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zone' }

  /zones/{code}:
    get:
      tags: [Zones]
      summary: Retrieve one zone
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Zone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /flight-requests:
    get:
      tags: [Flight requests]
      summary: List flight requests
      description: >-
        Scoped to the logged-in operator's own requests. A reviewer
        (X-Reviewer-Id) instead sees every operator's requests, and may
        additionally filter by operator_id.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/FlightRequestState' }
        - name: zone_code
          in: query
          schema: { type: string }
        - name: from
          in: query
          description: ISO timestamp — window_start >= from
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO timestamp — window_start <= to
          schema: { type: string, format: date-time }
        - name: operator_id
          in: query
          description: Reviewer-only; ignored (forced to session) for an operator caller
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Flight requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlightRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Flight requests]
      summary: Create a flight request
      description: Creates a request in DRAFT, under the logged-in operator.
      security:
        - OperatorSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFlightRequestInput' }
      responses:
        '201':
          description: Flight request created in DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Operator is suspended (precondition, not a gate — see docs/05-open-questions.md §1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: pilot_id, aircraft_id, or zone_code does not reference an existing entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flight-requests/{id}:
    get:
      tags: [Flight requests]
      summary: Retrieve a flight request
      description: Owning operator, or any reviewer.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      responses:
        '200':
          description: Flight request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /flight-requests/{id}/submit:
    post:
      tags: [Flight requests]
      summary: Submit for review
      description: >-
        Runs all four gates in order (PILOT → AIRCRAFT → ZONE →
        TIME_WINDOW), stopping at the first failure. On pass, moves DRAFT →
        UNDER_REVIEW. On failure, moves DRAFT → REJECTED directly (the
        request row is updated even though the response is a 422) and
        returns the failing gate. Owning operator only.
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      responses:
        '200':
          description: Moved to UNDER_REVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not currently in DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/GateFailed' }

  /flight-requests/{id}/validate:
    post:
      tags: [Flight requests]
      summary: Dry-run the gate pipeline
      description: >-
        Runs every gate exactly as submit would, in the same order, and
        never changes state. Owning operator, or any reviewer.
      security:
        - OperatorSession: []
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      responses:
        '200':
          description: All four gates passed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/GateFailed' }

  /flight-requests/{id}/cancel:
    post:
      tags: [Flight requests]
      summary: Cancel a flight request
      description: >-
        Legal from DRAFT, UNDER_REVIEW, or APPROVED. An APPROVED request
        cannot be cancelled less than 2 hours before window_start. Owning
        operator only.
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      responses:
        '200':
          description: Moved to CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not cancellable in its current state, or past the 2-hour deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flight-requests/{id}/approve:
    post:
      tags: [Flight requests]
      summary: Approve a request under review
      security:
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveInput' }
      responses:
        '200':
          description: Moved to APPROVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400':
          description: X-Reviewer-Id header missing, or a malformed body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Operator is suspended (precondition — see docs/05-open-questions.md §1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not currently UNDER_REVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flight-requests/{id}/reject:
    post:
      tags: [Flight requests]
      summary: Reject a request under review
      description: A note is required.
      security:
        - ReviewerHeader: []
      parameters:
        - $ref: '#/components/parameters/FlightRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectInput' }
      responses:
        '200':
          description: Moved to REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightRequest' }
        '400':
          description: X-Reviewer-Id header missing, or note missing/malformed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not currently UNDER_REVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
